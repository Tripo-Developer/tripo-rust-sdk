[package]
name = "tripo3d-sdk"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Official Rust SDK for the Tripo3D v3 AI 3D generation API."
license = "MIT"
readme = "README.md"
repository = "https://github.com/VAST-AI-Research/tripo-rust-sdk"
homepage = "https://github.com/VAST-AI-Research/tripo-rust-sdk"
documentation = "https://docs.rs/tripo3d-sdk"
authors = ["VAST AI <xuanwang868@gmail.com>"]
keywords = ["tripo3d", "tripo", "3d", "ai", "sdk"]
categories = ["api-bindings", "graphics"]
include = [
  "src/**/*",
  "examples/**/*",
  "tests/**/*",
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "README.zh-CN.md",
]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
anyhow = "1"

[[example]]
name = "text_to_model"
path = "examples/text_to_model.rs"

[[example]]
name = "image_to_model"
path = "examples/image_to_model.rs"

[[example]]
name = "rig_and_animate"
path = "examples/rig_and_animate.rs"

[[example]]
name = "text_to_image"
path = "examples/text_to_image.rs"

[[example]]
name = "image_to_image"
path = "examples/image_to_image.rs"
